# Profile Enhancement Groups Template for Clash Verge
# 用途: 三链路负载均衡 + 一键开关。
#
# 为什么必须写 url/interval 健康检查 (实测结论, 非常重要):
#   没有健康检查时, 成员的 alive 恒为 false, mihomo 的 load-balance 会退化成
#   "只使用列表里的第一个成员", 完全不轮询 -> 叠加失效。
#   加上健康检查后成员 alive=true, round-robin 才会按连接轮流分发。
#   实测: 8 条并发流严格按 3/2/3 分摊到三条腿。
#
# 配套约束: 健康检查 URL 的域名必须在规则里放行为 DIRECT
#   (见 rules.yaml 最前面的 DOMAIN-SUFFIX,rom.miui.com,DIRECT),
#   否则它可能被 GEOIP,CN 规则送回"正在被检测的那个组"形成环路。
prepend:

  # ---- 三链路: 手机USB + 有线 + 无线 (最快) ----
  - name: 多线直连
    type: load-balance
    strategy: round-robin          # 需要出口 IP 稳定时改成 consistent-hashing
    url: http://connect.rom.miui.com/generate_204
    interval: 300
    proxies:
      - WAN-PHONE
      - WAN-WIRED
      - WAN-WIFI

  # ---- 两条固定线路: 不消耗手机流量 ----
  - name: 多线-省流量
    type: load-balance
    strategy: round-robin
    url: http://connect.rom.miui.com/generate_204
    interval: 300
    proxies:
      - WAN-WIRED
      - WAN-WIFI

  # ---- 开关本体: 规则指向它, 在面板/托盘里一键切换 ----
  - name: 多线聚合
    type: select
    proxies:
      - 多线直连
      - 多线-省流量
      - DIRECT

append: []

delete: []
