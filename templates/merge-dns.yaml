# ==============================================================================
# Clash Verge 全局扩展配置 (Merge) —— DNS 自锁修复
# 用途: 写入「全局扩展配置」项对应的文件 (profiles.yaml 里 uid=Merge 的那一项),
#       对所有订阅生效。
#
# 【为什么需要它】实测故障链:
#   订阅节点抖动/失效
#     -> 很多订阅的 DNS 配了 fallback: [1.1.1.1, 8.8.8.8]
#     -> 规则里偏偏有 IP-CIDR,1.1.1.1/32 -> <代理组> 与 8.8.8.8/32 -> <代理组>
#     -> fallback 查询被送进已挂的代理节点 -> 每个查询等 5 秒超时
#     -> 所有海外域名解析失败(连节点自己的域名也解析不出来)
#     -> 节点永远连不上 -> fallback 永远超时   ← 自锁, 表现为"整个网络都崩了"
#   TUN 模式下所有程序的 DNS 都走内核, 所以症状是"每个网站都卡死/超时"。
#
# 【修复】去掉依赖代理的海外 fallback, 只用国内 nameserver。
#   走代理的域名由节点远端解析, 本地 DNS 结果不影响它们, 所以这个取舍是划算的。
#
# 下面把原 dns 段关键项照抄一遍, 保证无论 Verge 是"深合并"还是"整段替换"都安全。
# ==============================================================================

profile:
  store-selected: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  # 关键改动: 清空海外 fallback, 消除"DNS 依赖代理"的自锁
  fallback: []
  fallback-filter:
    geoip: false
    geosite: []
    ipcidr: []
    domain: []
