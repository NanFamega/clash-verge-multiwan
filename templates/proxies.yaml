# Profile Enhancement Proxies Template for Clash Verge
# 用途: 定义三条"绑定物理网卡"的直连出口。
# 占位符 {{NIC_*}} 由 scripts/install.ps1 自动替换为本机真实网卡名。
prepend:
  - name: WAN-PHONE
    type: direct
    interface-name: "{{NIC_PHONE}}"   # 手机 USB 共享 (Remote NDIS)
  - name: WAN-WIRED
    type: direct
    interface-name: "{{NIC_WIRED}}"   # 有线网卡
  - name: WAN-WIFI
    type: direct
    interface-name: "{{NIC_WIFI}}"    # 无线网卡

append: []

delete: []
